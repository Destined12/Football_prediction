databases:
  - name: football-db
    plan: free
    databaseName: football_prediction
    user: football_user

services:
  - type: web
    plan: free
    name: football-prediction
    runtime: python
    buildCommand: "cd web && ./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: PYTHONPATH
        value: "web"
      - key: DATABASE_URL
        fromDatabase:
          name: football-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: WEB_CONCURRENCY
        value: "4"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://football-prediction-wixv.onrender.com"
